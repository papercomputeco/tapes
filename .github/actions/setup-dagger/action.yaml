name: Setup Dagger

description: Install Nix and expose the Dagger CLI pinned by flake.lock

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8

    - name: Add the locked Dagger CLI to PATH
      shell: bash
      run: |
        set -euo pipefail
        dagger_path="$(nix build --no-link --print-out-paths .#dagger)"
        echo "${dagger_path}/bin" >> "${GITHUB_PATH}"

    - name: Verify the Dagger version
      shell: bash
      run: |
        dagger version
        make dagger-version-check
