name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to ECR Public
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      # extproc ships to a private ECR repository in the Tooling account, not
      # to ECR Public alongside tapes: the public repositories are enumerated
      # in terraform with an anonymous-pull policy and tapes-extproc is not one
      # of them. Two registries, two logins. Both use the same assumed role.
      - name: Login to ECR (private)
        id: login-ecr-private
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push tapes image
        run: |
          nix develop --command dagger call \
            build-push-tapes-images \
              --registry=${{ vars.REGISTRY }} \
              --tags="${{ github.event.release.tag_name }}" \
              --tags="latest" \
              --version="${{ github.event.release.tag_name }}" \
              --commit="${{ github.sha }}" \
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      # Without this the data plane has no image to pin: tko's versions.yaml
      # names <EXTPROC_REGISTRY>/tapes-extproc:<tag>, and a release that
      # publishes only the tapes image leaves that tag missing.
      - name: Push extproc image
        run: |
          if [ -z "${{ vars.EXTPROC_REGISTRY }}" ]; then
            echo "EXTPROC_REGISTRY repository variable is not set." >&2
            echo "It must be the private ECR registry host for the Tooling" >&2
            echo "account (see makefile EXTPROC_REGISTRY). Refusing to push" >&2
            echo "extproc to REGISTRY, which is ECR Public and hosts tapes." >&2
            exit 1
          fi
          nix develop --command dagger call \
            build-push-extproc-images \
              --registry=${{ vars.EXTPROC_REGISTRY }} \
              --tags="${{ github.event.release.tag_name }}" \
              --tags="latest" \
              --version="${{ github.event.release.tag_name }}" \
              --commit="${{ github.sha }}"
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Build upload release artifacts
        run: |
          nix develop --command dagger call \
            release-latest \
              --version="${{ github.event.release.tag_name }}" \
              --commit="${{ github.sha }}" \
              --post-hog-public-key="${{ secrets.POSTHOG_API_KEY }}" \
              --endpoint=env://BUCKET_ENDPOINT \
              --bucket=env://BUCKET_NAME \
              --access-key-id=env://BUCKET_ACCESS_KEY_ID \
              --secret-access-key=env://BUCKET_SECRET_ACCESS_KEY \
            export \
              --path=./build
        env:
          BUCKET_ENDPOINT: ${{ secrets.BUCKET_ENDPOINT }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          BUCKET_ACCESS_KEY_ID: ${{ secrets.BUCKET_ACCESS_KEY_ID }}
          BUCKET_SECRET_ACCESS_KEY: ${{ secrets.BUCKET_SECRET_ACCESS_KEY }}
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      # The two published OpenAPI contracts, attached so a consumer can generate
      # a client against a fixed release instead of against whatever a live
      # server happens to be serving. Names are load-bearing: consumers fetch
      # tapes-api-<tag>.yaml and tapes-ingest-<tag>.yaml by predictable name.
      #
      # These are the CORE compiled documents — the routes each server
      # registers, with field prose folded in from this checkout. Neither is the
      # runtime aggregate a server publishes at GET /openapi: that document has
      # each mounted cassette's spec merged into it, which makes it a property
      # of a deployment's cassettes rather than of this release, and it is not
      # something a release asset can honestly stand in for.
      #
      # Exported outside build/ deliberately: the upload step below derives an
      # os/arch suffix from each path under build/, and a contract has neither.
      - name: Build API contracts
        run: |
          nix develop --command dagger call \
            contracts \
            export \
              --path=./contracts
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Upload artifacts to release
        run: |
          mkdir -p dist
          for file in $(find build -type f); do
            rel_path="${file#build/}"
            os=$(dirname "$rel_path" | cut -d'/' -f1)
            arch=$(dirname "$rel_path" | cut -d'/' -f2)
            filename=$(basename "$file")

            if [[ "$filename" == *.sha256 ]]; then
              base="${filename%.sha256}"
              new_name="${base}-${os}-${arch}.sha256"
            else
              new_name="${filename}-${os}-${arch}"
            fi

            cp "$file" "dist/$new_name"
          done

          tag="${{ github.event.release.tag_name }}"
          cp contracts/tapes-api.yaml "dist/tapes-api-${tag}.yaml"
          cp contracts/tapes-ingest.yaml "dist/tapes-ingest-${tag}.yaml"

          gh release upload "${{ github.event.release.tag_name }}" dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
