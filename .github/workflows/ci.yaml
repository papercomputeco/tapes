name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Both Dockerfiles are release inputs, so build their complete release
  # platform set on every PR. Publishing happens from release.yaml.
  image:
    name: Build ${{ matrix.image }} image
    runs-on: depot-ubuntu-24.04-4
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: tapes
            dockerfile: Dockerfile
          - image: tapes-extproc
            dockerfile: Dockerfile.extproc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ matrix.image }}:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false
          sbom: false

  test-e2e:
    name: E2E Test (proxy / ingest / derive / span search)
    runs-on: depot-ubuntu-24.04-4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Run E2E tests via Dagger
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        run: nix develop --command make e2e-test

  build:
    name: Build
    runs-on: depot-ubuntu-24.04-4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Build binaries via Dagger
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        run: nix develop --command dagger call build export --path=./build --cloud

      - name: Upload darwin arm64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64-binaries
          path: build/darwin/arm64/
          retention-days: 1

      - name: Upload darwin amd64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: darwin-amd64-binaries
          path: build/darwin/amd64/
          retention-days: 1

      - name: Upload linux amd64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-binaries
          path: build/linux/amd64/
          retention-days: 1

      - name: Upload linux arm64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-binaries
          path: build/linux/arm64/
          retention-days: 1

  smoke:
    name: Smoke Test (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macOS 15 (arm64)
            runner: macos-15
            artifact: darwin-arm64-binaries
          - os: macOS 15 (amd64)
            runner: macos-15-intel
            artifact: darwin-amd64-binaries
          - os: Linux (amd64)
            runner: depot-ubuntu-24.04
            artifact: linux-amd64-binaries
          - os: Linux (arm64)
            runner: depot-ubuntu-24.04-arm
            artifact: linux-arm64-binaries

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ./bin

      - name: Run canary
        run: |
          chmod +x ./bin/tapes
          ./bin/tapes version
