name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The envelope corpus is a contract between capture paths that live in
  # different repositories, so a change to it can break a consumer this
  # workflow never builds. It needs no services, so it gates every PR on its
  # own rather than waiting for a suite that needs a database.
  parity:
    name: Contract Fixtures (envelope corpus parity)
    runs-on: depot-ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Run contract fixture gates via Dagger
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        run: nix develop --command make parity

  # The ext_proc adapter is a separate deployable built from this repository,
  # and this is the gate that used to be its own repository's entire CI. It
  # needs no services, so like parity it runs on every PR instead of waiting
  # for the suite that needs a database — which is the point: extproc sits on
  # the Envoy request path, and it should not be possible to break it here
  # without the PR going red.
  extproc:
    name: Extproc Test (ext_proc adapter / wire-capture fidelity)
    runs-on: depot-ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Run extproc tests via Dagger
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        run: nix develop --command make test-extproc

  # extproc ships as its own image, so a Dockerfile that no longer builds is a
  # broken release rather than a broken test. The image is built and thrown
  # away; publishing happens from release.yaml.
  extproc-image:
    name: Extproc Image
    runs-on: depot-ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Build the extproc image via Dagger
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        run: nix develop --command make check-extproc-image

  test-e2e:
    name: E2E Test (proxy / ingest / derive / span search)
    runs-on: depot-ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Run E2E tests via Dagger
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        run: nix develop --command make e2e-test

  build:
    name: Build
    runs-on: depot-ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Build binaries via Dagger
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        run: nix develop --command dagger call build export --path=./build

      - name: Upload darwin arm64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64-binaries
          path: build/darwin/arm64/
          retention-days: 1

      - name: Upload darwin amd64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: darwin-amd64-binaries
          path: build/darwin/amd64/
          retention-days: 1

      - name: Upload linux amd64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-binaries
          path: build/linux/amd64/
          retention-days: 1

      - name: Upload linux arm64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-binaries
          path: build/linux/arm64/
          retention-days: 1

  smoke:
    name: Smoke Test (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macOS 15 (arm64)
            runner: macos-15
            artifact: darwin-arm64-binaries
          - os: macOS 15 (amd64)
            runner: macos-15-intel
            artifact: darwin-amd64-binaries
          - os: Linux (amd64)
            runner: depot-ubuntu-24.04
            artifact: linux-amd64-binaries
          - os: Linux (arm64)
            runner: depot-ubuntu-24.04-arm
            artifact: linux-arm64-binaries

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ./bin

      - name: Run canary
        run: |
          chmod +x ./bin/tapes
          ./bin/tapes version
